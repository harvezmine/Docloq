<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23226bc0'/><g transform='translate(3.6 3.6) scale(0.7)'><path fill-rule='evenodd' clip-rule='evenodd' fill='white' d='M11.63 2.09a1 1 0 0 1 .74 0l7 2.8A1 1 0 0 1 20 5.82v5.4c0 4.98-3.08 9.1-7.62 10.94a1 1 0 0 1-.76 0C7.08 20.32 4 16.2 4 11.22v-5.4a1 1 0 0 1 .63-.93l7-2.8ZM8.6 8.4a.9.9 0 0 0 0 1.8h6.8a.9.9 0 0 0 0-1.8H8.6Zm0 3.5a.9.9 0 0 0 0 1.8h5.1a.9.9 0 0 0 0-1.8H8.6Zm0 3.5a.9.9 0 0 0 0 1.8h3.4a.9.9 0 0 0 0-1.8H8.6Z'/></g></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocLoq</title>
    <style>
      /* Landing splash: a guilloche seal engraves itself around the mark while the bundle loads. */
      #dl-splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: radial-gradient(ellipse 60% 55% at 50% 45%, #071a3d 0%, #041029 62%, #030b1d 100%); color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .7s cubic-bezier(.22,1,.36,1), visibility .7s; }
      #dl-splash.dl-out { opacity: 0; visibility: hidden; }
      #dl-splash .dl-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; transition: transform .7s cubic-bezier(.22,1,.36,1); }
      #dl-splash.dl-out .dl-stage { transform: scale(1.05); }
      #dl-splash svg { width: 184px; height: 184px; overflow: visible; }
      #dl-splash .dl-strand { fill: none; stroke: #64a2f0; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: dl-draw 1.05s cubic-bezier(.65,0,.35,1) forwards; }
      #dl-splash .dl-rim { fill: none; stroke: #3d84db; stroke-width: .6; opacity: 0; animation: dl-fade .8s .45s ease-out forwards; }
      #dl-splash .dl-tile { transform-origin: 100px 100px; opacity: 0; transform: scale(.8); animation: dl-pop .75s .3s cubic-bezier(.22,1,.36,1) forwards; }
      #dl-splash .dl-word { font-size: 22px; font-weight: 600; letter-spacing: -.015em; opacity: 0; transform: translateY(8px); animation: dl-pop .7s .5s cubic-bezier(.22,1,.36,1) forwards; }
      #dl-splash .dl-bar { position: relative; width: 88px; height: 2px; border-radius: 2px; background: rgba(100,162,240,.16); overflow: hidden; opacity: 0; animation: dl-fade .5s .65s ease-out forwards; }
      #dl-splash .dl-bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 2px; background: #64a2f0; animation: dl-sweep 1.2s .65s ease-in-out infinite; transform: translateX(-100%); }
      @keyframes dl-draw { to { stroke-dashoffset: 0; } }
      @keyframes dl-fade { to { opacity: 1; } }
      @keyframes dl-pop { to { opacity: 1; transform: none; } }
      @keyframes dl-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #dl-splash *, #dl-splash .dl-stage { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
        #dl-splash .dl-bar { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="dl-splash" aria-hidden="true">
      <div class="dl-stage">
        <svg viewBox="0 0 200 200">
          <g id="dl-rosette" transform="rotate(-90 100 100)"></g>
          <circle class="dl-rim" cx="100" cy="100" r="60" />
          <circle class="dl-rim" cx="100" cy="100" r="99" />
          <g class="dl-tile">
            <rect x="74" y="74" width="52" height="52" rx="13" fill="#1559a4" />
            <path transform="translate(81.6 81.6) scale(1.533)" fill="#fff" fill-rule="evenodd" clip-rule="evenodd" d="M11.63 2.09a1 1 0 0 1 .74 0l7 2.8A1 1 0 0 1 20 5.82v5.4c0 4.98-3.08 9.1-7.62 10.94a1 1 0 0 1-.76 0C7.08 20.32 4 16.2 4 11.22v-5.4a1 1 0 0 1 .63-.93l7-2.8ZM8.6 8.4a.9.9 0 0 0 0 1.8h6.8a.9.9 0 0 0 0-1.8H8.6Zm0 3.5a.9.9 0 0 0 0 1.8h5.1a.9.9 0 0 0 0-1.8H8.6Zm0 3.5a.9.9 0 0 0 0 1.8h3.4a.9.9 0 0 0 0-1.8H8.6Z" />
          </g>
        </svg>
        <div class="dl-word">DocLoq</div>
        <div class="dl-bar"></div>
      </div>
    </div>
    <script>
      // Splash shows on the landing page once per session (add ?splash to the URL to replay it)
      // and leaves as soon as the app has rendered, never before its short draw-in finishes.
      (function () {
        var el = document.getElementById('dl-splash');
        if (!el) return;
        var force = /[?&]splash\b/.test(location.search);
        var seen = false;
        try { seen = sessionStorage.getItem('docloq:splash') === '1'; } catch (e) { /* storage blocked */ }
        if (!force && (location.pathname !== '/' || seen)) {
          el.parentNode.removeChild(el);
          window.__docloqSplashDone = true;
          return;
        }
        try { sessionStorage.setItem('docloq:splash', '1'); } catch (e) { /* storage blocked */ }

        // Guilloche seal: interlaced sine rings, built here so the HTML stays small.
        var group = document.getElementById('dl-rosette');
        function weave(R, A, n, strands, width, opacity, delay) {
          var steps = n * 16;
          for (var s = 0; s < strands; s++) {
            var phase = (Math.PI * s) / strands, d = '';
            for (var i = 0; i <= steps; i++) {
              var t = (Math.PI * 2 * i) / steps, r = R + A * Math.sin(n * t + phase);
              d += (i ? 'L' : 'M') + (100 + r * Math.cos(t)).toFixed(1) + ' ' + (100 + r * Math.sin(t)).toFixed(1);
            }
            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d + 'Z');
            path.setAttribute('pathLength', '1');
            path.setAttribute('class', 'dl-strand');
            path.setAttribute('stroke-width', width);
            path.setAttribute('opacity', opacity);
            path.style.animationDelay = (delay + s * 0.03) + 's';
            group.appendChild(path);
          }
        }
        weave(74, 9, 24, 6, 0.7, 0.9, 0);
        weave(90, 5, 48, 4, 0.55, 0.5, 0.12);

        var start = Date.now(), MIN_MS = 1150, finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          setTimeout(function () {
            el.className += ' dl-out';
            window.__docloqSplashDone = true;
            window.dispatchEvent(new Event('docloq:splash-done'));
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 750);
          }, Math.max(0, MIN_MS - (Date.now() - start)));
        }
        function whenPainted() {
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(finish, finish);
          else finish();
        }
        var root = document.getElementById('root');
        var observer = new MutationObserver(function () {
          if (root.firstChild) { observer.disconnect(); requestAnimationFrame(whenPainted); }
        });
        observer.observe(root, { childList: true });
        setTimeout(finish, 6000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

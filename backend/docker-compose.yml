version: '3.8'

services:
  # ============================================================
  # Database — PostgreSQL 16
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: docloq_postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docloq_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docloq_network
    restart: always

  # ============================================================
  # Object Storage — Cloudflare R2 (no local container needed)
  # Configure via S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY in .env
  # Buckets: docloq-documents, docloq-archive, docloq-qrcodes
  # ============================================================

  # ============================================================
  # Key Management — HashiCorp Vault (Transit Engine)
  # ============================================================
  vault:
    image: hashicorp/vault:1.17
    container_name: docloq_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-docloq-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - docloq_network
    restart: always

  # ============================================================
  # Malware Scanner — ClamAV
  # ============================================================
  clamav:
    image: clamav/clamav:stable
    container_name: docloq_clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - docloq_network
    restart: always

  # ============================================================
  # Vector Database — Qdrant (AI semantic search)
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.13.1
    container_name: docloq_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - docloq_network
    restart: always

  # ============================================================
  # Rate Limiter Store — Redis (persistent rate limiting)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: docloq_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docloq_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Cache Database — MongoDB (AI Analysis Cache)
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: docloq_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-docloq}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-docloq-mongo-secret}
      MONGO_INITDB_DATABASE: docloq_ai_cache
    volumes:
      - mongodb_data:/data/db
    networks:
      - docloq_network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # Opsional: pgAdmin
  # ============================================================
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: docloq_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@docloq.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - docloq_network
  #   depends_on:
  #     - db

  # ============================================================
  # OSINT Search — SearXNG (self-hosted meta search engine)
  # ============================================================
  searxng:
    image: searxng/searxng:latest
    container_name: docloq_searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - docloq_network
    restart: always

volumes:
  postgres_data:
  clamav_data:
  qdrant_data:
  mongodb_data:
  redis_data:

networks:
  docloq_network:
    driver: bridge
